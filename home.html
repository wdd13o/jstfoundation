<body>
    <header>
        <div class="container">
            <h1>Our Event Post</h1>
            <nav id="authNav">
                <!-- This will be populated by JavaScript -->
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="events-list">
            <h2>Upcoming Events</h2>
            <div class="filter-controls">
                <input type="text" id="searchEvents" placeholder="Search events...">
                <select id="filterDate">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
            </div>
            <div id="eventsContainer" class="events-container">
                <!-- Events will be loaded here -->
            </div>
        </section>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in and update UI accordingly
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const authNav = document.getElementById('authNav');
            
            if (currentUser && currentUser.isSuperUser) {
                authNav.innerHTML = `
                
                    <a href="create.html" class="nav-link">Create Event</a>
                    <a href="#" id="logout" class="nav-link">Logout</a>
                    <span class="user-greeting">Hello, ${currentUser.name} <span class="admin-badge">(Admin)</span></span>
                `;
                
                document.getElementById('logout').addEventListener('click', function(e) {
                    e.preventDefault();
                    localStorage.removeItem('currentUser');
                    window.location.reload();
                });
            } else {
                authNav.innerHTML = '<a href="login.html" class="nav-link login-button">Admin Login to Post </a>';
            }

            // Load and display events
            loadAndRenderEvents();

            // Search and filter functionality
            document.getElementById('searchEvents').addEventListener('input', filterEvents);
            document.getElementById('filterDate').addEventListener('change', filterEvents);
        });

        function loadAndRenderEvents() {
            const events = JSON.parse(localStorage.getItem('events')) || [];
            renderEvents(events);
        }

        function renderEvents(eventsToRender) {
            const eventsContainer = document.getElementById('eventsContainer');
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (eventsToRender.length === 0) {
                eventsContainer.innerHTML = '<div class="no-events">No events found.</div>';
                return;
            }
            
            eventsContainer.innerHTML = '';
            
            eventsToRender.forEach(event => {
                const eventDate = new Date(event.date);
                const formattedDate = eventDate.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
                
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';
                
                // Only show delete button if admin is logged in
                const deleteButton = currentUser && currentUser.isSuperUser ? 
                    `<button class="delete-btn" data-id="${event.id}">
                        <i class="fas fa-trash"></i> Delete
                    </button>` : '';
                
                eventCard.innerHTML = `
                    <div class="event-image" style="background-image: url('${event.image}')"></div>
                    <div class="event-details">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <span class="event-date"><i class="far fa-calendar-alt"></i> ${formattedDate} at ${event.time}</span>
                        </div>
                        <div class="event-location">
                            <i class="fas fa-map-marker-alt"></i> ${event.location}
                        </div>
                        <p class="event-description">${event.description}</p>
                        ${deleteButton}
                    </div>
                `;
                
                eventsContainer.appendChild(eventCard);
            });

            // Add event listeners to delete buttons if they exist
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const eventId = parseInt(this.getAttribute('data-id'));
                    deleteEvent(eventId);
                });
            });
        }

        function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                const events = JSON.parse(localStorage.getItem('events')) || [];
                const updatedEvents = events.filter(event => event.id !== id);
                localStorage.setItem('events', JSON.stringify(updatedEvents));
                renderEvents(updatedEvents);
            }
        }

        function filterEvents() {
            const searchTerm = document.getElementById('searchEvents').value.toLowerCase();
            const dateFilter = document.getElementById('filterDate').value;
            const events = JSON.parse(localStorage.getItem('events')) || [];
            
            let filteredEvents = events.filter(event => {
                const matchesSearch = event.title.toLowerCase().includes(searchTerm) || 
                                     event.description.toLowerCase().includes(searchTerm) || 
                                     event.location.toLowerCase().includes(searchTerm);
                
                if (!matchesSearch) return false;
                
                const eventDate = new Date(event.date);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                
                if (dateFilter === 'today') {
                    return eventDate.toDateString() === today.toDateString();
                } else if (dateFilter === 'week') {
                    const nextWeek = new Date(today);
                    nextWeek.setDate(nextWeek.getDate() + 7);
                    return eventDate >= today && eventDate <= nextWeek;
                } else if (dateFilter === 'month') {
                    const nextMonth = new Date(today);
                    nextMonth.setMonth(nextMonth.getMonth() + 1);
                    return eventDate >= today && eventDate <= nextMonth;
                }
                
                return true;
            });
            
            renderEvents(filteredEvents);
        }


        function renderEvents(eventsToRender) {
            const eventsContainer = document.getElementById('eventsContainer');
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            if (eventsToRender.length === 0) {
                eventsContainer.innerHTML = '<div class="no-events">No events found.</div>';
                return;
            }
            
            eventsContainer.innerHTML = '';
            
            eventsToRender.forEach(event => {
                const eventDate = new Date(event.date);
                const formattedDate = eventDate.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
                
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';
                
                // Only show delete button if admin is logged in
                const deleteButton = currentUser && currentUser.isSuperUser ? 
                    `<button class="delete-btn" data-id="${event.id}">
                        <i class="fas fa-trash"></i> Delete
                    </button>` : '';
                
                eventCard.innerHTML = `
                    <div class="event-image" style="background-image: url('${event.image}')"></div>
                    <div class="event-details">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <span class="event-date"><i class="far fa-calendar-alt"></i> ${formattedDate} at ${event.time}</span>
                        </div>
                        <div class="event-location">
                            <i class="fas fa-map-marker-alt"></i> ${event.location}
                        </div>
                        <p class="event-description">${event.description}</p>
                        ${deleteButton}
                    </div>
                `;
                
                eventsContainer.appendChild(eventCard);
            });
        
            // Add event listeners to delete buttons if they exist
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const eventId = parseInt(this.getAttribute('data-id'));
                    showDeleteConfirmation(eventId);
                });
            });
        }
        
        function showDeleteConfirmation(eventId) {
            // Create confirmation modal
            const modal = document.createElement('div');
            modal.className = 'confirmation-modal';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>Confirm Deletion</h3>
                    <p>Are you sure you want to delete this event?</p>
                    <div class="modal-buttons">
                        <button id="confirmDelete" class="confirm-btn">Yes, Delete</button>
                        <button id="cancelDelete" class="cancel-btn">Cancel</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // Handle confirmation
            document.getElementById('confirmDelete').addEventListener('click', function() {
                deleteEvent(eventId);
                document.body.removeChild(modal);
            });
            
            // Handle cancellation
            document.getElementById('cancelDelete').addEventListener('click', function() {
                document.body.removeChild(modal);
            });
        }
        
        function deleteEvent(id) {
            const events = JSON.parse(localStorage.getItem('events')) || [];
            const updatedEvents = events.filter(event => event.id !== id);
            localStorage.setItem('events', JSON.stringify(updatedEvents));
            renderEvents(updatedEvents);
        }
    </script>
