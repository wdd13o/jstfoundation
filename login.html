<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super User Login</title>
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h2>Super User Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Predefined super users (in a real app, this would be server-side)
            const SUPER_USERS = [
                {
                    id: 1,
                    name: "John",
                    email: "admin@example.com",
                    password: "admin123", // In production, use proper hashed passwords
                    isSuperUser: true
                }
            ];

            // Store super users in localStorage if not already present
            if (!localStorage.getItem('superUsers')) {
                localStorage.setItem('superUsers', JSON.stringify(SUPER_USERS));
            }

            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                const superUsers = JSON.parse(localStorage.getItem('superUsers'));
                const user = superUsers.find(u => u.email === email && u.password === password);
                
                if (user && user.isSuperUser) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = 'home.html';
                } else {
                    alert('Access denied. Only super users can login.');
                }
            });
        });
    </script>
</body>
</html>
