<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Create Event</h1>
            <nav>
                <a href="index.html" class="nav-link">View Events</a>
                <a href="#" id="logout" class="nav-link">Logout</a>
                <span id="userGreeting"></span>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="event-form">
            <h2>Create New Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" placeholder="Enter event title" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventTime">Time</label>
                    <input type="time" id="eventTime" required>
                </div>
                <div class="form-group">
                    <label for="eventLocation">Location</label>
                    <input type="text" id="eventLocation" placeholder="Enter event location" required>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Enter event description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="eventImage">Upload Image (optional)</label>
                    <input type="file" id="eventImage" accept="image/*">
                </div>
                <button type="submit" class="submit-btn">Post Event</button>
            </form>
        </section>
    </div>

    <script src="js/event.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            // Display user greeting
            document.getElementById('userGreeting').textContent = `Hello, ${currentUser.name}`;

            // Logout functionality
            document.getElementById('logout').addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });

            // Set default date to today
            document.getElementById('eventDate').valueAsDate = new Date();

            // Form submission
            document.getElementById('eventForm').addEventListener('submit', function (e) {
                e.preventDefault();

                // Get form values
                const title = document.getElementById('eventTitle').value.trim();
                const date = document.getElementById('eventDate').value;
                const time = document.getElementById('eventTime').value;
                const location = document.getElementById('eventLocation').value.trim();
                const description = document.getElementById('eventDescription').value.trim();
                const imageInput = document.getElementById('eventImage');

                let image = 'https://via.placeholder.com/400x200?text=Event+Image'; // Default image

                // Handle image upload
                if (imageInput.files && imageInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        image = event.target.result; // Base64 encoded image
                        saveEvent();
                    };
                    reader.readAsDataURL(imageInput.files[0]);
                } else {
                    saveEvent();
                }

                function saveEvent() {
                    // Create event object
                    const event = {
                        id: Date.now(),
                        title,
                        date,
                        time,
                        location,
                        description,
                        image,
                        authorId: currentUser.id,
                        authorName: currentUser.name
                    };

                    // Retrieve existing events from localStorage
                    const events = JSON.parse(localStorage.getItem('events')) || [];

                    // Add the new event to the events array
                    events.unshift(event);

                    // Save updated events to localStorage
                    localStorage.setItem('events', JSON.stringify(events));

                    // Redirect to home page
                    window.location.href = 'home.html';
                }
            });
        });
    </script>
</body>
</html>
