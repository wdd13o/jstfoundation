<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Events</title>
    <link rel="stylesheet" href="css/event.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Daily Events</h1>
            <p>Share and discover events happening around you</p>
        </header>

        <div class="main-content">
            <section class="event-form">
                <h2>Create New Event</h2>
                <form id="eventForm">
                    <div class="form-group">
                        <label for="eventTitle">Event Title</label>
                        <input type="text" id="eventTitle" placeholder="Enter event title" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDate">Date</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" required>
                    </div>
                    <div class="form-group">
                        <label for="eventLocation">Location</label>
                        <input type="text" id="eventLocation" placeholder="Enter event location" required>
                    </div>
                    <div class="form-group">
                        <label for="eventDescription">Description</label>
                        <textarea id="eventDescription" placeholder="Enter event description" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="eventImage">Image URL (optional)</label>
                        <input type="url" id="eventImage" placeholder="https://example.com/image.jpg">
                    </div>
                    <button type="submit" class="submit-btn">Post Event</button>
                </form>
            </section>

            <section class="events-list">
                <h2>Upcoming Events</h2>
                <div class="filter-controls">
                    <input type="text" id="searchEvents" placeholder="Search events...">
                    <select id="filterDate">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>
                <div id="eventsContainer" class="events-container">
                    <!-- Events will be loaded here -->
                </div>
            </section>
        </div>
    </div>

    <script src="js/event.js"></script>
</body>
</html>
