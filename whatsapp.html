<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Company</title>
    <style>
        /* Page Loader Styles */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
        }
        
        .loader-logo {
            position: absolute;
            width: 60px;
            height: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }
        
        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 5px solid transparent;
            border-top-color: #3498db; /* Change to your brand color */
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }
        
        .loader-ring:nth-child(2) {
            border-top-color: #f1c40f; /* Secondary color */
            animation-delay: 0.3s;
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
        }
        
        .loader-ring:nth-child(3) {
            border-top-color: #2ecc71; /* Tertiary color */
            animation-delay: 0.6s;
            width: 60%;
            height: 60%;
            top: 20%;
            left: 20%;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide loader when loaded */
        .loaded .page-loader {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Page Loader -->
    <div class="page-loader">
        <div class="loader-container">
            <img src="img/icon.png" alt="Company Logo" class="loader-logo">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- Your page content goes here -->
    <div class="content">
        <h1>Welcome to Our Website</h1>
        <p>Your content will appear here after loading.</p>
    </div>

    <script>
        // Wait for window load
        window.addEventListener('load', function() {
            // Add small delay for smooth transition
            setTimeout(function() {
                document.body.classList.add('loaded');
                
                // Remove loader from DOM after animation completes
                setTimeout(function() {
                    document.querySelector('.page-loader').remove();
                }, 500); // Match this with the CSS transition duration
            }, 500);
        });
    </script>
</body>
</html>
